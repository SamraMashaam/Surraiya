<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 450px;
      height: 300px;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #1f2937 55%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      color: white;
      padding: 30px;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 20px 0;
    }
    p {
      font-size: 20px;
      margin: 0 0 30px 0;
      opacity: 0.9;
    }
      img{
      width: 70px;
      height: 70px;
      margin-top: 10px;
    }
    .sub{
      font-size: 16px; 
      margin-bottom: 25px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="s_logo.png" alt="logo" />
    <p>You've been inactive for 1 minute!</p>
    <p class="sub">Time to get back to work</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
